name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Commit messages carry no AI lines or em-dashes
        run: tools/check-commits.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (plugin and plugin interface)
        run: ./gradlew --continue :plugin-api:testDebugUnitTest :mqtt:testDebugUnitTest

      - name: Lint and release build
        run: ./gradlew :mqtt:lintDebug :mqtt:assembleRelease :mqtt:publishReleasePublicationToMavenLocal

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            mqtt/build/reports/
            mqtt/build/test-results/
            vendor/plugin-api/build/reports/
          if-no-files-found: ignore

      - name: Upload the plugin library
        uses: actions/upload-artifact@v4
        with:
          name: mqtt-plugin-aar
          path: mqtt/build/outputs/aar/*.aar
